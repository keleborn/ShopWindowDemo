<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">Просмотр продукта</title>
</head>
<body>
<div style="text-align: right;">
    <a th:href="@{/cart}">Корзина</a>
</div>
<div style="text-align: right;">
    <a th:href="@{/orders}">Заказы</a>
</div>
<div style="text-align: right;">
    <a th:href="@{/balance}">Проверить баланс</a>
</div>
<div style="text-align: right;">
    <div th:unless="${authenticated}">
        <a th:href="@{/oauth2/authorization/keycloak}">Войти</a>
    </div>
    <div th:if="${authenticated and !isKeycloakAuthorized}">
        <form action="/oauth2/keycloak" method="get">
            <button type="submit">OAuth2 авторизация</button>
        </form>
    </div>
    <div th:if="${authenticated}">
        <form th:action="@{/logout}" method="post">
            <button type="submit">Выйти</button>
        </form>
    </div>
</div>
<div>
    <p><strong>Название:</strong> <span th:text="${product.name}"></span></p>
    <p><strong>Описание:</strong> <span th:text="${product.description}"></span></p>
    <p><strong>Цена:</strong> <span th:text="${product.price}"></span>у.е</p>
    <p><strong>Доступность:</strong> <span th:text="${product.isAvailable ? 'В наличии' : 'Нет в наличии'}"></span></p>
    <div th:if="${product.imageUrl != null}">
        <img th:src="@{${product.imageUrl}}" width="200"/>
    </div>
    <form th:action="@{/products/cart/add/{id}(id=${product.id})}" method="post">
        <label for="qty">Количество:></label>
        <input type="number" id="qty" name="quantity" min="1" step="1" required>
        <button type="submit">Добавить в корзину</button>
    </form>
</div>
<hr>
<a th:href="@{/products}">Назад к витрине</a>
</body>
</html>
